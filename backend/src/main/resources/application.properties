spring.application.name=instagram-clone-backend

# --- Database (PostgreSQL) ---
# Point these at your local Postgres instance, or a hosted one (Render's free
# Postgres, Neon, Supabase, ...) when running the backend outside of your
# machine. Vercel itself cannot host this Spring Boot service -- see README
# "Deployment" section. Unlike MySQL, Postgres needs the database to already
# exist -- there's no "create if missing" JDBC URL flag, so run
# `createdb instagram_clone` (or the hosted equivalent) once beforehand.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/instagram_clone}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Override with a long random secret in every real deployment.
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-in-production-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
# Comma-separated list of allowed frontend origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Frontend URL (used to build the dev-mode password reset link) ---
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- Image storage ---
# When BLOB_READ_WRITE_TOKEN is set, uploads go to Vercel Blob (production).
# When it's blank (local dev), uploads fall back to local disk under
# app.upload.local-dir and are served back via the /uploads/** static mapping.
app.blob.read-write-token=${BLOB_READ_WRITE_TOKEN:}
app.upload.local-dir=${UPLOAD_LOCAL_DIR:uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080/uploads}

# --- File upload limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}
